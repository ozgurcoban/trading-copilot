[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-copilot"
version = "0.1.0"
description = "Deterministic market-data snapshot engine for Trading Copilot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic==1.0.0",
  "numpy>=2.1,<3",
  "openai==3.3.1",
  "pandas>=2.2,<3",
  "pydantic>=2.10,<3",
  "yfinance==1.5.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "ai_live: opt-in tests that call paid AI provider APIs",
  "live: tests that call external market-data services",
]
